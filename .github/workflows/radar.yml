name: QA Radar update

on:
  schedule:
    - cron: "26 9 * * *"       # daily at 6:00 AM
  workflow_dispatch:          # "Run workflow" button

permissions:
  contents: write

concurrency:
  group: qa-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'api' }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'llama3.2:3b' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Start local model (Ollama mode only)
        if: env.LLM_PROVIDER == 'ollama'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &) || true
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:11434/api/tags > /dev/null || { cat /tmp/ollama.log; exit 1; }
          ollama pull "$OLLAMA_MODEL"

      - name: Run agent
        env:
          LLM_BASE_URL: ${{ env.LLM_PROVIDER == 'ollama' && 'http://localhost:11434/v1' || vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ env.LLM_PROVIDER == 'ollama' && env.OLLAMA_MODEL || vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python agent/main.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "📡 radar update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash
          git push
